<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#000000"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><title>IITJ Mess Menu</title>
<style>
:root{color-scheme:dark;--bg:#000;--fg:#f4f4f4;--dim:#9b9b9b;--line:#5a5a5a}
*{box-sizing:border-box}
html{background:var(--bg);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;min-height:100dvh;background:var(--bg);color:var(--fg);font:16px/1.45 "Courier New",ui-monospace,"Lucida Console",monospace;letter-spacing:.04em;text-transform:uppercase;-webkit-font-smoothing:none;font-smooth:never}
body::after{content:"";position:fixed;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.045) 0 1px,transparent 1px 3px)}
main{width:100%;max-width:560px;margin:0 auto;padding:18px 14px 40px;overflow:hidden}
.screen{border:2px solid var(--fg);padding:18px 14px 20px;margin:0}
button{font:inherit;letter-spacing:inherit;text-transform:inherit;color:var(--fg);background:none;border:0;cursor:pointer;padding:0;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.title{text-align:center;white-space:nowrap;font-size:22px;margin:4px 0 2px}
.sub{text-align:center;color:var(--dim);white-space:nowrap;font-size:12px;margin-bottom:20px}
.label{color:var(--dim);font-size:12px;margin:18px 0 8px;white-space:nowrap}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.days button{padding:9px 0;border:1px solid var(--line);text-align:center;white-space:nowrap;min-width:0}
.days button.today:not(.active){border-color:var(--fg)}
.days button.active{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.meals{display:grid;gap:2px}
.meals button{text-align:left;padding:7px 4px;white-space:pre;font-size:18px;overflow:hidden}
.meals button.active .cur,.cur.on{animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
@media(prefers-reduced-motion:reduce){.meals button.active .cur{animation:none}}
.daylabel{display:flex;justify-content:space-between;align-items:baseline;gap:8px;border-top:1px solid var(--line);margin-top:18px;padding-top:14px}
.daylabel strong{font-size:22px;white-space:nowrap;font-weight:400;min-width:0}
.daylabel span{color:var(--dim);font-size:12px;white-space:nowrap}
.block{border-top:1px dashed var(--line);padding:12px 0 4px}
.block:first-child{border-top:0}
.bhead{display:flex;justify-content:space-between;gap:8px;color:var(--dim);font-size:12px;margin-bottom:5px}
.bhead h2{margin:0;font:inherit;color:var(--fg);white-space:nowrap}
.bhead .tag{white-space:nowrap;min-width:0}
.food{font-size:17px;line-height:1.5;overflow-wrap:anywhere;word-break:break-word;max-width:100%}
.common .food{font-size:13px;color:#cfcfcf}
.search{width:100%;display:block;margin:20px 0 12px;background:#000;color:var(--fg);border:1px solid var(--fg);border-radius:0;padding:11px 10px;font:inherit;font-size:14px;letter-spacing:inherit;text-transform:uppercase;min-width:0;caret-color:var(--fg)}
.search::placeholder{color:var(--dim);opacity:1}
.results{display:grid;gap:8px}
.result{border:1px solid var(--line);padding:10px;min-width:0;overflow:hidden}
.result b{font-weight:400;color:var(--dim);font-size:11px;overflow-wrap:anywhere}
.result p{margin:4px 0 0;font-size:14px;overflow-wrap:anywhere}
.empty{color:var(--dim);padding:20px;text-align:center;border:1px dashed var(--line);font-size:13px}
.hint{text-align:center;font-size:11px;line-height:1.35;margin:22px 0 0;color:var(--fg)}
.note{color:var(--dim);font-size:11px;line-height:1.4;margin:16px 0 0;text-transform:none;letter-spacing:.02em}
</style></head><body><main><div class="screen">
<div class="title" data-fit="22,12">MESS MENU</div>
<div class="sub" data-fit="12,8">IIT JODHPUR · DINING · WEEKLY</div>
<div class="label">SELECT DAY</div>
<div class="days" id="days"></div>
<div class="label">SELECT MEAL</div>
<div class="meals" id="meals"></div>
<div class="daylabel"><strong id="dayname">Friday</strong><span id="prettydate"></span></div>
<section id="menu"></section>
<input class="search" id="search" type="search" placeholder="SEARCH THE WEEKLY MENU..." autocomplete="off" aria-label="Search the weekly menu">
<div id="results" class="results"></div>
<p class="hint">SELECT BY TAPPING<br>DAY AND MEAL</p>
<p class="note">Menu data is taken from the uploaded November 2026 non-veg menu, which repeats every week. “Additional item” is shown exactly as the sheet lists it; it isn't always a non-veg dish.</p>
</div></main><script>
const DATA={"Monday": {"Breakfast": {"veg": "Masala Poori, Matar Sabzi and Kheer", "extra": "Boiled egg (2)", "common": "Toasted white/whole wheat bread, Butter, Jam, Sugar, Cornflakes, Sprouts-boiled chana, Milk(Non-Toned), Tea, Coffee, Bournvita"}, "Lunch": {"veg": "Gobi Achari, kala chana, Moong dal", "extra": "Boondi raita(200ml)", "common": "Plain Rice, Atta Roti, Salad(Beetroot+tomato+onion+cucumber+lemon+chilli), Pickle, Lizzat Papad, Ghee"}, "Snacks": {"veg": "Dahi bada, Mirchi Chutney, Imli Chutney", "extra": "__", "common": "Milk(Non-Toned), Tea, Coffee"}, "Dinner": {"veg": "khatta Meetha Kaddu, Sabut Masoor dal, Gulab Jamun", "extra": "Egg Burji", "common": "Plain Rice, Atta Roti, Salad(Beetroot+tomato+onion+cucumber+lemon+chilli), Pickle, Fryums,Ghee"}}, "Tuesday": {"Breakfast": {"veg": "Idli+Fried Idli or Idli+Medu Vada, Sambhar, Coconut Chutney, Tomato Chutney", "extra": "Banana(2)", "common": "Toasted white/whole wheat bread, Butter, Jam, Sugar, Oats, Sprouts-boiled chana, Milk(Non-Toned), Tea, Coffee, Bournvita"}, "Lunch": {"veg": "Chana dal, Kashmiri Dum aloo, Aloo palak", "extra": "Curd(100ml)", "common": "Plain Rice, Atta Roti, Salad(Beetroot+tomato+onion+cucumber+lemon+chilli), Pickle, Lizzat Papad,Ghee"}, "Snacks": {"veg": "Aloo tikki, dahi, chole, Chutney, onion", "extra": "—", "common": "Milk(Non-Toned), Tea, Coffee"}, "Dinner": {"veg": "Methhi Matar Malai, Mix Veg, Dal Makhani, Jeera Rice", "extra": "—", "common": "Plain Rice, Atta Roti, Salad(Beetroot+tomato+onion+cucumber+lemon+chilli), Pickle, Fryums,Ghee"}}, "Wednesday": {"Breakfast": {"veg": "Poha, Sambar and Jalebi", "extra": "Boiled egg (2)", "common": "Toasted white/whole wheat bread, Butter, Jam, Sugar, Cornflakes, Sprouts-boiled chana, Milk(Non-Toned), Tea, Coffee, Bournvita"}, "Lunch": {"veg": "Malai kofta , Cabbage Matar, dal palak", "extra": "Veg Raita(200ml)", "common": "Plain Rice, Atta Roti, Salad(Beetroot+tomato+onion+cucumber+lemon+chilli), Pickle,Lizzat Papad, Ghee"}, "Snacks": {"veg": "Pani puri, Imili pani", "extra": "—", "common": "Milk(Non-Toned), Tea, Coffee"}, "Dinner": {"veg": "Aloo Kundru(dry), Dal Fry, Shahi Tukda with rabri", "extra": "Chicken Butter Masala", "common": "Plain Rice, Atta Roti, Salad(Beetroot+tomato+onion+cucumber+lemon+chilli), Pickle, Fryums,Ghee"}}, "Thursday": {"Breakfast": {"veg": "Methi Paratha, Aloo-matar ki Sabji, Dahi", "extra": "Banana(2)", "common": "Toasted white/whole wheat bread, Butter, Jam, Sugar, Oats, Sprouts-boiled chana, Milk(Non-Toned), Tea, Coffee, Bournvita"}, "Lunch": {"veg": "Kadi Pakora, Aloo-chokha, Lobiya Dal", "extra": "Sweet Lassi(200ml)", "common": "Plain Rice, Atta Roti, , Salad(Beetroot+tomato+onion+cucumber+lemon+chilli), Pickle,Lizzat Papad, Ghee"}, "Snacks": {"veg": "Maggi , ketchup", "extra": "—", "common": "Milk(Non-Toned), Tea, Coffee"}, "Dinner": {"veg": "Mix Veg, veg manchurian, Channa Dal, Biryani", "extra": "__", "common": "Plain Rice, Atta Roti, Salad(Beetroot+tomato+onion+cucumber+lemon+chilli), Pickle, Fryums, Ghee"}}, "Friday": {"Breakfast": {"veg": "Uttapam , Sambhar, Coconut Chutney", "extra": "Boiled egg (2)", "common": "Toasted white/whole wheat bread, Butter, Jam, Sugar, Cornflakes, Sprouts-boiled chana, Milk(Non-Toned), Tea, Coffee, Bournvita"}, "Lunch": {"veg": "Rajma , Gajar-beans-gobi sabzi, Dahi Aloo", "extra": "Pudina Chaas(200ml)", "common": "Plain Rice, Atta Roti, Salad(Beetroot+tomato+onion+cucumber+lemon+chilli), Pickle, Lizzat Papad, Ghee"}, "Snacks": {"veg": "Veg Sandwich , ketchup, Seasonal fruits", "extra": "—", "common": "Milk(Non-Toned), Tea, Coffee"}, "Dinner": {"veg": "Capsicum aloo, Dal Fry, Veg Biryani, Khoya Barfi", "extra": "Egg Curry with green peas and aloo", "common": "Plain Rice, Atta Roti, Salad(Beetroot+tomato+onion+cucumber+lemon+chilli), Pickle, Fryums, Ghee"}}, "Saturday": {"Breakfast": {"veg": "Masala dosa, Coconut Chutney, Sambhar", "extra": "Boiled egg (2)", "common": "Toasted white/whole wheat bread, Butter, Jam, Sugar, Oats, Sprouts-boiled chana, Milk(Non-Toned), Tea, Coffee, Bournvita"}, "Lunch": {"veg": "Hariyali Kofta, Gajar Matar sabzi, Lasooni Dal Tadka (arhar)", "extra": "Curd(100ml)", "common": "Plain Rice, Atta Roti, Salad(Beetroot+tomato+onion+cucumber+lemon+chilli), Pickle, Lizzat Papad,Ghee"}, "Snacks": {"veg": "Vada pao + chutney or Pao Bhaji+lemon+onion", "extra": "—", "common": "Milk(Non-Toned), Tea, Coffee"}, "Dinner": {"veg": "Aloo spring onion fry, Chole Bhature, Dal Tadka (mix)", "extra": "", "common": "Plain Rice, Atta Roti, Salad(Beetroot+tomato+onion+cucumber+lemon+chilli), Pickle, Fryums, Ghee"}}, "Sunday": {"Breakfast": {"veg": "Aloo Pyaaz paratha, Chutney, Dahi", "extra": "Boiled Egg (2)", "common": "Toasted white/whole wheat bread, Butter, Jam, Sugar, Cornflakes, Sprouts-boiled chana, Milk(Non-Toned), Tea, Coffee, Bournvita"}, "Lunch": {"veg": "Soya Chunk, Gobi matar masala, Green moong dal, Birista rice", "extra": "Masala Chass(200ml)", "common": "Plain Rice, Atta Roti, Salad(Beetroot+tomato+onion+cucumber+lemon+chilli), Pickle,Lizzat Papad, Ghee"}, "Snacks": {"veg": "Bread pakoda or Dal ke pakode, Chutney, Seasonal fruits", "extra": "—", "common": "Milk(Non-Toned), Tea, Coffee"}, "Dinner": {"veg": "Veg Korma, Arhar Dal, Ice cream(Butterscotch)", "extra": "Chilly Chicken or Chicken curry, Veg Fried Rice, veg Raita(200ml)", "common": "Plain Rice, Atta Roti, Salad(Beetroot+tomato+onion+cucumber+lemon+chilli), Pickle, Fryums, Ghee"}}};
const mealNames=["Breakfast","Lunch","Snacks","Dinner"];
const DAYS=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
const today=new Date().toLocaleDateString("en-US",{weekday:"long"});
let selected="Dinner", day=today;
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
const wrap=s=>esc(s).replace(/([+\/(),])/g,"$1<wbr>");
/* shrink text until it fits its box (no horizontal overflow) */
function fitEl(el,max,min){let s=max;el.style.fontSize=s+"px";while(el.scrollWidth>el.clientWidth+1&&s>min){s-=.5;el.style.fontSize=s+"px";}}
function fitGroup(els,max,min){if(!els.length)return;let s=max;const set=v=>els.forEach(e=>e.style.fontSize=v+"px");set(s);
 while(s>min&&els.some(e=>e.scrollWidth>e.clientWidth+1)){s-=.5;set(s);}}
function fitAll(){
 document.querySelectorAll("[data-fit]").forEach(el=>{const[a,b]=el.dataset.fit.split(",").map(Number);fitEl(el,a,b);});
 fitGroup([...document.querySelectorAll("#days button")],14,8);
 fitGroup([...document.querySelectorAll("#meals button")],18,10);
 fitEl(document.getElementById("dayname"),22,12);
 document.querySelectorAll(".bhead").forEach(h=>{const t=h.querySelector(".tag");if(t)fitEl(t,12,8);});
}
function render(){
 document.getElementById("days").innerHTML=DAYS.map(d=>`<button class="${d===day?'active':''} ${d===today?'today':''}" data-day="${d}" aria-pressed="${d===day}">${d.slice(0,3)}</button>`).join("");
 document.querySelectorAll("[data-day]").forEach(b=>b.onclick=()=>{day=b.dataset.day;render()});
 document.getElementById("dayname").textContent=day;
 document.getElementById("prettydate").textContent=day===today?"TODAY":"";
 document.getElementById("meals").innerHTML=mealNames.map(m=>`<button class="${m===selected?'active':''}" data-meal="${m}" aria-pressed="${m===selected}"><span class="cur">${m===selected?'&gt;':' '}</span> ${m}</button>`).join("");
 document.querySelectorAll("[data-meal]").forEach(b=>b.onclick=()=>{selected=b.dataset.meal;render()});
 const item=DATA[day]?.[selected];
 document.getElementById("menu").innerHTML=item?`
 <article class="block"><div class="bhead"><h2>${selected}</h2><span class="tag">MAIN MENU · VEG</span></div><div class="food">${wrap(item.veg)||"Not listed"}</div></article>
 <article class="block"><div class="bhead"><h2>Additional item</h2><span class="tag">AS LISTED</span></div><div class="food">${wrap(item.extra)||"No additional item listed"}</div></article>
 <article class="block common"><div class="bhead"><h2>Common items</h2><span class="tag">WITH MEAL</span></div><div class="food">${wrap(item.common)||"Not listed"}</div></article>`:`<div class="empty">No menu entry found.</div>`;
 fitAll();
}
document.getElementById("search").oninput=e=>{
 const q=e.target.value.trim().toLowerCase(), box=document.getElementById("results");
 if(!q){box.innerHTML="";return;}
 let out=[];
 for(const [d,meals] of Object.entries(DATA))for(const [meal,v] of Object.entries(meals)){
  for(const [kind,text] of [["Veg",v.veg],["Additional",v.extra],["Common",v.common]])if(text.toLowerCase().includes(q))out.push(`<div class="result"><b>${d} · ${meal} · ${kind}</b><p>${wrap(text)}</p></div>`);
 }
 box.innerHTML=out.length?out.join(""):'<div class="empty">No matches in the weekly menu.</div>';
};
addEventListener("resize",fitAll);
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(fitAll);
render();
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script></body></html>
